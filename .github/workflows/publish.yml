name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      module:
        type: choice
        description: 'Select the module to publish'
        options:
          - config-plugin
          - maven-publish-plugin
          - test-coverage-plugin
        required: true
      releaseType:
        type: choice
        description: 'Select the Release type'
        options:
          - major
          - minor
          - patch
        required: true
      releaseTicket:
        type: string
        description: 'Enter the Release ticket number'
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    environment: publishing_gradle_config
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ github.event.inputs.module }}
    steps:
      - name: Configure git
        shell: bash
        run: |
          git config --global user.name "sdk-bot-user"
          git config --global user.email "sdk.bot@moengage.com"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Set up gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: false
      - name: Set up Kotlin
        uses: ./.github/actions/setup-kotlin
      - name: Release
        env:
          publishKey: ${{ secrets.publishKey }}
          secretKey: ${{ secrets.secretKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: |
          kotlin ./.github/scripts/release.main.kts $publishKey $secretKey ${{ github.event.inputs.releaseType }} ${{ github.event.inputs.releaseTicket }} $MODULE
