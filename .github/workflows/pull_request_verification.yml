name: Verify Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [ "development", "master" ]

jobs:
  find-changed-modules:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Kotlin
        uses: ./.github/actions/setup-kotlin
      - name: Find changed modules
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: kotlin ./.github/scripts/find-changed-modules.main.kts

  verify-module:
    needs: find-changed-modules
    if: ${{ needs.find-changed-modules.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    environment: publishing_gradle_config
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.find-changed-modules.outputs.modules) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Set up gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false
      - name: Build module
        env:
          MODULE: ${{ matrix.module }}
        run: ./gradlew ":${MODULE//\//:}:assemble"
      - name: Lint check
        env:
          MODULE: ${{ matrix.module }}
        run: ./gradlew ":${MODULE//\//:}:spotlessCheck" :spotlessCheck
